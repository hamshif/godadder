[pytest]
markers =
    integration: tests that hit a running local server (opt-in)
    side_effect: tests that may perform external calls or mutate state (opt-in)
    requires_live_server: requires a running API server over HTTP
    requires_ollama: requires Ollama to be reachable at OLLAMA_URL
    requires_godaddy: requires GoDaddy credentials/config to be available
